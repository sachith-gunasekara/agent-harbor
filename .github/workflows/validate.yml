name: validate

# Gates every pull request. The linting half is delegated to .pre-commit-config.yaml
# so that CI and the local hooks run the identical set of checks and cannot drift
# apart — if it passes before you commit, it passes here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install yq
        # Needed by the repo's own hooks: sync-mirrors.sh reads mirrors.yaml with it,
        # and validate-skills.sh / gen-catalog.sh prefer it for frontmatter.
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint and validate
        # Covers shellcheck, actionlint, the fixer hooks, validate-skills.sh,
        # gen-catalog.sh and sync-mirrors.sh --verify. --show-diff-on-failure
        # prints exactly what a hook would have rewritten, so a stale generated
        # file reads as a diff rather than as an opaque failure.
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure --color always

      - name: sync-mirrors test suite
        # Not part of the pre-commit run above: it is a pre-push hook locally, so
        # CI has to invoke it explicitly. Offline — uses local fixture repos.
        run: ./scripts/test-sync.sh

      - name: Skills are discoverable
        # Not a lint: proves the skills/own/ + skills/mirrored/ catalog layout is
        # still something an installer can resolve.
        run: npx --yes skills add . -l
