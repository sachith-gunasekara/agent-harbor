name: mirror-sync

# Keeps skills/mirrored/ in step with the upstreams declared in mirrors.yaml.
#
# Runs on main only. The flow is: someone opens a PR editing mirrors.yaml, it is
# reviewed and merged, and only then does this fire — cloning each upstream and
# opening one pull request per skill that actually changed. Skills whose upstream
# content still hashes identically produce no PR at all.
#
# Running on main only matters. This workflow opens pull requests and pushes
# branches, so letting it run from a feature branch would mean an unreviewed
# version of the sync could raise PRs against the repo. mirrors.yaml has to be
# merged before it takes effect.

on:
  push:
    branches: [main]
    paths:
      - mirrors.yaml
      - scripts/sync-mirrors.sh
      - .github/workflows/mirror-sync.yml
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      skill:
        description: Only sync this mirror (blank = all)
        required: false
        type: string
      force:
        description: Re-materialise even if already up to date
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  detect:
    # The push trigger is already filtered to main, but workflow_dispatch can be
    # fired from any branch, so gate the work explicitly rather than relying on
    # the trigger alone.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Work out what changed
        id: plan
        run: |
          # Note: steps run under `bash -e`, so build the argument list with
          # if/fi rather than `[ ... ] && ...`, which would fail the step whenever
          # the condition is false.
          args=(--dry-run --json)
          if [ -n "${{ inputs.skill }}" ]; then args+=(--skill "${{ inputs.skill }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi

          # Report failures but still act on the mirrors that did resolve.
          if ! ./scripts/sync-mirrors.sh "${args[@]}" > plan.json; then
            echo "::warning::one or more mirrors failed to resolve; see the log"
          fi
          cat plan.json

          changed="$(jq -c '[.[] | select(.state != "unchanged") | .name]' plan.json)"
          {
            echo "changed=$changed"
            if [ "$(jq 'length' <<<"$changed")" -gt 0 ]; then
              echo "any=true"
            else
              echo "any=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Mirror sync plan"
            echo ""
            echo "| Skill | State | Upstream |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.name) | \(.state) | \(.repo)/\(.path) |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Serial on purpose: every mirror PR touches mirrors.lock.json and the
      # generated README, so parallel branches would race on the same lines.
      max-parallel: 1
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.changed) }}
    steps:
      - name: Check how pull requests will be authenticated
        # Runs before anything else so the warning is visible in the run that needs
        # it. A warning placed after the create-pull-request step is skipped when
        # that step fails, which is precisely when it would have been useful.
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "::warning::MIRROR_PAT is not set. Falling back to GITHUB_TOKEN, which needs 'Allow GitHub Actions to create and approve pull requests' enabled in Settings > Actions > General, and will not trigger validate.yml on the pull request it opens."
          fi

      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Sync ${{ matrix.skill }}
        id: sync
        run: |
          before="$(jq -r --arg n '${{ matrix.skill }}' '.mirrors[$n].commit // ""' mirrors.lock.json 2>/dev/null || true)"
          echo "before=$before" >> "$GITHUB_OUTPUT"

          args=(--skill '${{ matrix.skill }}')
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          ./scripts/sync-mirrors.sh "${args[@]}"
          ./scripts/gen-catalog.sh

          after="$(jq -r --arg n '${{ matrix.skill }}' '.mirrors[$n].commit // ""' mirrors.lock.json 2>/dev/null || true)"
          repo="$(jq -r --arg n '${{ matrix.skill }}' '.mirrors[$n].repo // ""' mirrors.lock.json 2>/dev/null || true)"
          path="$(jq -r --arg n '${{ matrix.skill }}' '.mirrors[$n].path // ""' mirrors.lock.json 2>/dev/null || true)"

          {
            echo "after=$after"
            echo "repo=$repo"
            echo "path=$path"
            if [ -z "$after" ]; then
              echo "action=removed"
            elif [ -z "$before" ]; then
              echo "action=added"
            else
              echo "action=updated"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Validate the result
        run: |
          ./scripts/validate-skills.sh
          ./scripts/sync-mirrors.sh --verify

      - name: Summarise upstream changes
        id: changes
        run: |
          repo='${{ steps.sync.outputs.repo }}'
          before='${{ steps.sync.outputs.before }}'
          after='${{ steps.sync.outputs.after }}'
          path='${{ steps.sync.outputs.path }}'
          {
            if [ -n "$repo" ] && [ -n "$before" ] && [ -n "$after" ] && [ "$before" != "$after" ]; then
              echo "Upstream commits touching \`$path\`:"
              echo ""
              echo '```'
              git clone --filter=blob:none --no-checkout -q "https://github.com/$repo.git" up 2>/dev/null || true
              git -C up log --oneline "$before..$after" -- "$path" 2>/dev/null | head -40 || echo "(could not read upstream log)"
              echo '```'
              echo ""
              echo "Compare: https://github.com/$repo/compare/$before...$after"
              rm -rf up
            fi
          } > body-extra.md
          cat body-extra.md

      - name: Compose PR body
        id: body
        run: |
          # Mirrors the structure of .github/PULL_REQUEST_TEMPLATE/mirror.md, so an
          # automated mirror PR and a hand-written one read the same way. Keep the
          # two in step when either changes.
          {
            echo "## Summary"
            echo ""
            echo "\`${{ matrix.skill }}\` was **${{ steps.sync.outputs.action }}** by \`mirror-sync\`."
            echo ""
            if [ "${{ steps.sync.outputs.action }}" = "removed" ]; then
              echo "Its record was dropped from \`mirrors.yaml\`, so the vendored copy, its"
              echo "lockfile entry and its generated rows are being deleted."
              echo ""
              echo "Re-adding the record vendors it again from scratch, so this is reversible."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| Upstream | \`${{ steps.sync.outputs.repo }}/${{ steps.sync.outputs.path }}\` |"
              echo "| From | \`${{ steps.sync.outputs.before }}\` |"
              echo "| To | \`${{ steps.sync.outputs.after }}\` |"
              echo ""
              echo "## Upstream changes"
              echo ""
              cat body-extra.md
            fi
            echo ""
            echo "## Review notes"
            echo ""
            echo "The vendored directory is a **byte-for-byte copy of upstream**. Review it as"
            echo "you would a dependency bump — especially anything under \`scripts/\`, which"
            echo "runs on your machine when the skill fires."
            echo ""
            echo "Everything else in the diff is generated: \`mirrors.lock.json\`, the README"
            echo "table, \`docs/skill-library.md\`, \`skills/mirrored/NOTICE.md\`, and the plugin"
            echo "manifest descriptions."
            echo ""
            echo "Do not hand-edit files under \`skills/mirrored/\` — the pre-commit hook and CI"
            echo "both enforce that they hash to the lockfile."
            echo ""
            echo "---"
            echo ""
            echo "- [ ] The upstream diff contains nothing I would not want running in my agent"
            echo "- [ ] The declared license still matches upstream"
            echo "- [ ] \`validate\` passed on this PR — if it did not run at all, see"
            echo "      [docs/mirroring.md](docs/mirroring.md) on \`MIRROR_PAT\`"
            echo ""
            echo "<sub>Opened by \`.github/workflows/mirror-sync.yml\`.</sub>"
          } > pr-body.md
          rm -f body-extra.md
          {
            echo "text<<PRBODY"
            cat pr-body.md
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: cpr
        # Allowed to fail: the branch is pushed before the pull request is created,
        # so a refusal here loses nothing and the fallback below can still open it.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT is preferred because pull requests created with the default
          # GITHUB_TOKEN do not trigger other workflows, so validate.yml would
          # never run on a mirror PR.
          token: ${{ secrets.MIRROR_PAT || secrets.GITHUB_TOKEN }}
          branch: mirror/${{ matrix.skill }}
          delete-branch: true
          commit-message: |
            chore(mirror): ${{ steps.sync.outputs.action }} ${{ matrix.skill }}

            Syncs skills/mirrored/${{ matrix.skill }} with
            ${{ steps.sync.outputs.repo }}/${{ steps.sync.outputs.path }}.
          title: "chore(mirror): ${{ steps.sync.outputs.action }} `${{ matrix.skill }}`"
          body: ${{ steps.body.outputs.text }}
          labels: |
            mirror
            automated
          add-paths: |
            skills/mirrored
            mirrors.lock.json
            README.md
            docs/skill-library.md
            .claude-plugin

      - name: Open the pull request with the workflow token
        # Reached only when the step above was refused. The two tokens fail for
        # different reasons and are not interchangeable, so trying the other one is
        # a real second chance rather than a retry:
        #
        #   MIRROR_PAT     fails with "Resource not accessible by personal access
        #                  token" when the token lacks Pull requests: write
        #   GITHUB_TOKEN   fails with "GitHub Actions is not permitted to create or
        #                  approve pull requests" when that repo setting is off
        #
        # The branch is already pushed at this point, so this only has to create the
        # pull request. A PR opened this way will not trigger validate.yml — that is
        # the cost of the fallback, and it is called out in the PR body.
        if: steps.cpr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skill='${{ matrix.skill }}'
          if gh pr view "mirror/$skill" --json number >/dev/null 2>&1; then
            echo "a pull request for mirror/$skill already exists"
            exit 0
          fi
          {
            cat pr-body.md
            echo ""
            echo "> ⚠️ Opened with the workflow token because \`MIRROR_PAT\` was refused."
            echo "> \`validate\` will not run here. See [docs/mirroring.md](docs/mirroring.md)."
          } > fallback-body.md
          gh pr create \
            --base main --head "mirror/$skill" \
            --title "chore(mirror): ${{ steps.sync.outputs.action }} \`$skill\`" \
            --body-file fallback-body.md \
            --label mirror --label automated
          echo "::warning::MIRROR_PAT was refused, so this PR was opened with the workflow token and validate.yml will not run on it. Give the token Pull requests: read and write."

      - name: Report the outcome
        # Runs whatever happened, so the summary is written even when both attempts
        # failed. Fails the job only if no pull request exists at the end.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skill='${{ matrix.skill }}'
          if gh pr view "mirror/$skill" --json number >/dev/null 2>&1; then
            url="$(gh pr view "mirror/$skill" --json url --jq .url)"
            echo "### \`$skill\`: $url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Could not open a pull request for \`$skill\`"
            echo ""
            echo "The branch \`mirror/$skill\` was pushed, so nothing is lost — only the"
            echo "pull request is missing. Both tokens were refused."
            echo ""
            echo "Fix whichever you intend to use:"
            echo ""
            echo "- **\`MIRROR_PAT\`** — needs *Pull requests: read and write*, and repository"
            echo "  access covering this repo. This is the one to prefer: pull requests"
            echo "  created with the workflow token do not trigger \`validate.yml\`."
            echo "- **Workflow token** — needs Settings → Actions → General → *Allow GitHub"
            echo "  Actions to create and approve pull requests*."
            echo ""
            echo "Or open it by hand:"
            echo ""
            echo '```'
            echo "gh pr create --base main --head mirror/$skill"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::No pull request could be opened for $skill. The branch was pushed; see the job summary."
          exit 1
