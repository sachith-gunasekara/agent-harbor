# Skills mirrored from other repositories into skills/mirrored/.
#
# Edit this file to add, pin, or remove a mirror, then open a PR. Once it is
# merged to main, `.github/workflows/mirror-sync.yml` clones each upstream,
# compares content, and opens one pull request per skill that actually changed.
# Nothing else here is hand-maintained — mirrors.lock.json and skills/mirrored/
# are both generated.
#
# Fields:
#   repo      required  owner/name on GitHub
#   skill     required  the skill's name, which is also its directory name
#                       upstream. Resolved the way an installer resolves it, so
#                       you do not need to know where in the repo it lives.
#   ref       optional  branch, tag, or full 40-char SHA. Defaults to
#                       `defaults.ref`. Use a SHA to freeze a skill.
#   license   required  SPDX id of the upstream license. You are redistributing
#                       this code — the sync refuses to run without it, and warns
#                       if it cannot find a matching LICENSE file upstream.
#   name      optional  vendor under a different local directory name, for when
#                       the upstream name collides with something already here
#   path      optional  explicit upstream directory. Only needed to break a tie
#                       when a repo has several directories with the same name.
#   homepage  optional  link for the catalog; defaults to the repo URL
#   notes     optional  one line explaining why this skill is mirrored
#
# See docs/mirroring.md for the full workflow.

version: 1

defaults:
  ref: HEAD # upstream default branch

mirrors:
  - repo: obra/superpowers
    skill: brainstorming
    ref: main
    license: MIT
    notes: Structured idea generation before committing to an approach.

  - repo: obra/superpowers
    skill: systematic-debugging
    ref: main
    license: MIT
    notes: Root-cause debugging loop that resists guess-and-check fixes.
